name: digitalmenu

services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwerty123}
      POSTGRES_DB: ${POSTGRES_DB:-digitalmenu_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-digitalmenu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. FastAPI Backend Service (backend)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: digitalmenu-backend:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-qwerty123}@db:5432/${POSTGRES_DB:-digitalmenu_db}
      PORT: 8011
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_PORT:-8011}:8011"
    volumes:
      - ./backend:/app
      - /app/venv
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ============================================================================
  # 3. Admin Dashboard (web-admin)
  # ============================================================================
  admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    image: digitalmenu-admin:latest
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    environment:
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      FAST_REFRESH: "true"
      REACT_APP_API_URL: "http://localhost:8011"
    volumes:
      - ./web-admin/src:/app/src
      - ./web-admin/public:/app/public
    depends_on:
      - backend

  # ============================================================================
  # 4. Digital Menu Customer Frontend (web-digitalmenu)
  # ============================================================================
  userend:
    build:
      context: ./web-digitalmenu
      dockerfile: Dockerfile
    image: digitalmenu-userend:latest
    restart: unless-stopped
    ports:
      - "${USEREND_PORT:-3002}:3002"
    environment:
      PORT: 3002
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      FAST_REFRESH: "true"
      REACT_APP_API_URL: "http://localhost:8011"
    volumes:
      - ./web-digitalmenu/src:/app/src
      - ./web-digitalmenu/public:/app/public
    depends_on:
      - backend

  # ============================================================================
  # 5. Unified Gateway (Nginx Reverse Proxy)
  # ============================================================================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - admin
      - userend

volumes:
  postgres_data:
    name: digitalmenu_postgres_data
    driver: local
